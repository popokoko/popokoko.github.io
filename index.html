<!DOCTYPE html>
<html lang="zh-Hant" class="scroll-smooth theme-newyear">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEACELOVE | Innovate. Collaborate. Inspire.</title>

    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 載入 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Montserrat:wght@700;800&family=Poppins:wght@700;800&family=Roboto:wght@400;700&family=Mountains+of+Christmas:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        /* 自定義漸變和字體 */
        :root {
            --color-core-start: #00c6ff;
            /* 科技藍 */
            --color-core-end: #0072ff;
            /* 科技深藍/綠 (調整為更和諧的漸變) */
            --color-hues-start: #ffafbd;
            /* 柔和粉 */
            --color-hues-end: #c94b4b;
            /* 柔和紫/紅 (調整為更和諧的漸變) */
        }

        /* 聖誕節主題變數 (Premium Christmas - Warm Pink Theme) */
        :root.theme-christmas {
            --color-core-start: #FF7096;
            /* Vibrant Warm Pink */
            --color-core-end: #FF5C8A;
            /* Deeper Warm Pink */
            --color-hues-start: #FFA3BA;
            /* Light Warm Pink */
            --color-hues-end: #FFB3C1;
            /* Softest Pink */
        }

        /* 新年主題變數 (Premium New Year 2026 - Cloud Dancer Style) */
        :root.theme-newyear {
            --color-core-start: #B8C6DB;
            /* Cloud Blue/Silver */
            --color-core-end: #A3B1C6;
            /* Deeper Cloud */
            --color-hues-start: #D4AF37;
            /* Champagne Gold */
            --color-hues-end: #C5A028;
            /* Rich Gold */
        }

        /* 新年特別樣式調整 (Cloud Dancer Background) */
        .theme-newyear body {
            background-color: #F0EEE9;
            /* PANTONE 11-4201 TCX Cloud Dancer (Approx) */
            background-image:
                linear-gradient(white 2px, transparent 2px),
                linear-gradient(90deg, white 2px, transparent 2px);
            background-size: 50px 50px;
            background-position: -2px -2px;
            color: #334155;
            /* Slate 700 - Soft Dark Text */
        }

        /* 導覽列修復 (Cloud Dancer Theme - Light & Airy) */
        .theme-newyear header {
            background-color: rgba(240, 238, 233, 0.9) !important;
            /* Cloud Dancer with transparency */
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
        }

        .theme-newyear #mobile-menu {
            background-color: #F0EEE9 !important;
            /* Cloud Dancer solid */
        }

        /* 新年主題下文字顏色調整 (Dark Text for Light Bg) */
